# Replace REVIEWED_GOVERNANCE_COMMIT before use; enable only after protection preflight.
name: Release PR
on:
  push:
    branches: [$default-branch]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: release-pr-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    if: vars.RYBSKIWORKS_RELEASE_PRS == 'true'
    uses: rybskiworks/.github/.github/workflows/reusable-release-pr.yml@REVIEWED_GOVERNANCE_COMMIT
    with:
      target-branch: $default-branch
